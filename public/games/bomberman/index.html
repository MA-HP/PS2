<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bomberman - RetroNet Arena</title>
    <style>
      body { font-family: Tahoma, sans-serif; background:#0b1030; color:#fff; display:grid; place-items:center; min-height:100vh; margin:0; }
      .panel { background:#121a4a; border:1px solid #4f6fff; padding:20px; border-radius:8px; width:min(92vw,700px); }
      h1 { margin-top:0; }
      code { color:#00d4ff; }
    </style>
  </head>
  <body>
    <main class="panel">
      <h1>Bomberman - Mode Versus (squelette)</h1>
      <p>Ce module est prêt à accueillir la logique gameplay et la synchro Socket.io.</p>
      <p>Room ID via querystring: <code id="room"></code></p>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search);
      document.getElementById('room').textContent = params.get('room') || 'N/A';
    </script>
  </body>
</html>
